databases:
  - name: study-db
    plan: free
    databaseName: studyaidb
    user: studyai_user

services:
  - type: web
    name: ai-study-planner
    env: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 60 --max-requests 500 --max-requests-jitter 50

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7

      - key: SECRET_KEY
        generateValue: true

      - key: FLASK_DEBUG
        value: "false"

      - key: DATABASE_URL
        fromDatabase:
          name: study-db
          property: connectionString

      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false